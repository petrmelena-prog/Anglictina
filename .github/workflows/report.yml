name: Report pokroku

# Tydenni report v nedeli vecer, mesicni prvniho dne v mesici rano.
# Data bere z Issues s labelem "rozbor" - tedy z rozboru jednotlivych hovoru.
# Spousteci udalosti jsou zamerne na jedinem radku - tim je tenhle blok
# odolny proti prepsani odsazeni pri kopirovani do editoru.
on: {schedule: [{cron: "0 17 * * 0"}, {cron: "0 6 1 * *"}], workflow_dispatch: {inputs: {typ: {description: "tyden nebo mesic", required: false, default: "tyden"}}}}

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Sestavit report a poslat
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:        ${{ github.repository }}
          SCHEDULE:       ${{ github.event.schedule }}
          TYP:            ${{ inputs.typ }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, re, json, datetime, zoneinfo
          import urllib.request, urllib.error, urllib.parse

          GKEY   = os.environ.get("GEMINI_API_KEY", "")
          GHTOK  = os.environ["GH_TOKEN"]
          GHREPO = os.environ["GH_REPO"]
          SCHED  = os.environ.get("SCHEDULE", "") or ""
          TYP    = (os.environ.get("TYP", "") or "").strip()

          PRAHA = zoneinfo.ZoneInfo("Europe/Prague")
          now = datetime.datetime.now(PRAHA)

          # mesicni report pozna podle cronu; rucne podle vstupu
          if not TYP:
              TYP = "mesic" if SCHED.strip().startswith("0 6 1") else "tyden"
          DNI  = 30 if TYP == "mesic" else 7
          print("Typ reportu:", TYP, "| okno:", DNI, "dni", flush=True)

          def gh(path, params=None):
              url = "https://api.github.com/repos/%s/%s" % (GHREPO, path)
              if params: url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + GHTOK,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "kalifornan"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          def post(url, body, headers, timeout=90):
              req = urllib.request.Request(url, data=json.dumps(body).encode("utf-8"),
                                           method="POST", headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, json.loads(r.read().decode("utf-8", "replace"))

          # ---------- 1. nacist rozbory ----------
          od = (now - datetime.timedelta(days=DNI * 2)).astimezone(datetime.timezone.utc)
          issues = gh("issues", {"labels": "rozbor", "state": "all",
                                 "since": od.strftime("%Y-%m-%dT%H:%M:%SZ"),
                                 "per_page": "100"})
          print("Nalezeno rozboru v okne 2x%d dni: %d" % (DNI, len(issues)), flush=True)

          hranice = now - datetime.timedelta(days=DNI)
          strop  = now - datetime.timedelta(days=DNI * 2)
          teto, minule = [], []
          for it in issues:
              if it.get("pull_request"): continue
              body = it.get("body") or ""
              vytv = datetime.datetime.fromisoformat(
                        it["created_at"].replace("Z", "+00:00")).astimezone(PRAHA)
              # "since" filtruje podle upravy, ne vzniku - stare hovory zahodit
              if vytv < strop: continue
              delka = re.search(r"\*\*Delka:\*\*\s*(\d+)", body)
              slov  = re.search(r"Rekl jsi\s*(\d+)\s*slov", body)
              tema  = re.search(r"\*\*Tema:\*\*\s*(.+?)\s{2,}", body + "  ")
              # prepis ven - pro rozbor trendu staci hodnoceni, transkript by jen zabral misto
              rozbor = re.split(r"<details>", body)[0]
              rozbor = re.sub(r"^\*\*Tema.*?---\s*", "", rozbor, flags=re.S)
              zaznam = {"kdy": vytv, "tema": (tema.group(1).strip() if tema else ""),
                        "delka": int(delka.group(1)) if delka else 0,
                        "slov": int(slov.group(1)) if slov else 0,
                        "rozbor": rozbor.strip()}
              (teto if vytv >= hranice else minule).append(zaznam)

          teto.sort(key=lambda x: x["kdy"])
          print("Toto obdobi: %d hovoru | predchozi: %d" % (len(teto), len(minule)), flush=True)

          nazev_obd = "týden" if TYP == "tyden" else "měsíc"

          # ---------- 2. kdyz nic, posli kratke pripomenuti ----------
          if not teto:
              nadpis = "Report za %s — ani jeden hovor" % nazev_obd
              telo = ("Za poslední %s nepřišel **ani jeden zvednutý hovor**.\n\n"
                      "Nic se neděje, stává se. Ale tři hovory týdně jsou celý motor téhle věci — "
                      "bez nich se nic nezmění, ať je appka jakkoli dobrá.\n\n"
                      "Kdyby telefon nezvonil kvůli technické chybě, podívej se do "
                      "[Actions](https://github.com/%s/actions), jestli běhy neskončily červeně."
                      % (nazev_obd, GHREPO))
              owner = GHREPO.split("/")[0]
              post("https://api.github.com/repos/%s/issues" % GHREPO,
                   {"title": nadpis, "body": telo, "labels": ["report"], "assignees": [owner]},
                   {"Authorization": "Bearer " + GHTOK, "Accept": "application/vnd.github+json",
                    "Content-Type": "application/json", "User-Agent": "kalifornan"})
              print("Poslano pripomenuti - zadny hovor.", flush=True)
              sys.exit(0)

          # ---------- 3. cisla spocitat v kodu, ne modelem ----------
          def souhrn(z):
              n = len(z)
              slov = sum(x["slov"] for x in z)
              sek  = sum(x["delka"] for x in z)
              return {"n": n, "slov": slov, "min": sek / 60.0,
                      "prum": (slov / n if n else 0)}

          A, B = souhrn(teto), souhrn(minule)

          def trend(a, b, jednotka="", des=0):
              if not b: return "%s%s" % (round(a, des) if des else int(a), jednotka)
              d = a - b
              zn = "+" if d > 0 else ""
              proc = (" (%s%d %%)" % ("+" if d > 0 else "", round(d / b * 100))) if b else ""
              return "%s%s — %s%s%s%s" % (round(a, des) if des else int(a), jednotka,
                                          zn, round(d, des) if des else int(d), jednotka, proc)

          cisla = (
            "| | tento %s | předchozí |\n|---|---|---|\n"
            "| Hovorů | **%d** | %d |\n"
            "| Minut u mikrofonu | **%.1f** | %.1f |\n"
            "| Slov anglicky | **%d** | %d |\n"
            "| Průměr slov na hovor | **%d** | %d |\n"
          ) % (nazev_obd, A["n"], B["n"], A["min"], B["min"], A["slov"], B["slov"],
               A["prum"], B["prum"])

          nejdelsi = max(teto, key=lambda x: x["slov"])

          # ---------- 4. kvalitativni cast necha napsat model ----------
          material = []
          for x in teto:
              material.append("### %s — %s (%d slov, %d s)\n%s" %
                  (x["kdy"].strftime("%d.%m."), x["tema"], x["slov"], x["delka"], x["rozbor"]))
          material = "\n\n".join(material)[:120000]

          if TYP == "tyden":
              ZADANI = (
                "Jsi Petruv ucitel anglictiny. Petr je Cech, ctyricatnik, uroven mluveni A1-A2. "
                "Jeho cilem je ROZMLUVIT SE - prekonat stud a mluvit nahlas na ciziho cloveka. "
                "Dostanes rozbory jeho telefonatu za posledni tyden. Napis mu TYDENNI report v CESTINE.\n\n"
                "Presne tuhle strukturu, nic navic, zadny uvod:\n\n"
                "## Zlepsil ses?\n"
                "Dve az tri vety. Na rovinu - kdyz posun nevidis, rekni to. Nevymysli si zlepseni, "
                "ktere v datech neni. Kdyz vidis posun, ukaz ho na konkretni veci, kterou rekl.\n\n"
                "## Chyba, ktera se vraci\n"
                "JEDNA chyba, ktera se objevila nejvickrat. Format: co rikal spatne, jak spravne, "
                "a jedna veta v cestine proc. Vyber tu, ktera nejvic brani porozumeni - ne tu nejcastejsi.\n\n"
                "## Na tomhle pracuj tenhle tyden\n"
                "JEDNA konkretni vec. Ne seznam. Musi to byt neco, co pozna pri pristim hovoru.\n\n"
                "Bud vlidny, ale nelzi mu. Zadne obecne chvaleni. Kratce - cely report do 250 slov."
              )
          else:
              ZADANI = (
                "Jsi Petruv ucitel anglictiny. Petr je Cech, ctyricatnik, uroven mluveni A1-A2. "
                "Jeho cilem je ROZMLUVIT SE. Dostanes rozbory vsech jeho telefonatu za posledni mesic. "
                "Napis mu MESICNI report v CESTINE.\n\n"
                "Presne tuhle strukturu, nic navic, zadny uvod:\n\n"
                "## Kde jsi byl a kde jsi\n"
                "Ctyri az pet vet. Porovnej zacatek mesice s koncem. Konkretne - cituj, co rikal "
                "tehdy a co rika teď. Kdyz posun neni, rekni to natvrdo, to je cennejsi nez lichoceni.\n\n"
                "## Odhad urovne\n"
                "Realisticky odhad CEFR jeho MLUVENEHO projevu (napr. A2 nebo A2/B1) a jedna veta proc.\n\n"
                "## Tri veci, ktere se opakuji\n"
                "Tri nejcastejsi chyby za cely mesic, nejdulezitejsi prvni. U kazde: co rika spatne, "
                "jak spravne, jedna veta proc v cestine bez gramatickeho zargonu.\n\n"
                "## Je cas pritvrdit?\n"
                "Agent ted mluvi na urovni A1-A2, osm slov ve vete, bez frazovych sloves a idiomu. "
                "Doporuc ANO nebo JESTE NE, a jednou vetou proc. Signal pro ANO: Petr uz nepotrebuje, "
                "aby mu agent veci opakoval, odpovida delsimi vetami a rozumi bez zadrhelu.\n\n"
                "## Na cem pracovat pristi mesic\n"
                "Jedna az dve konkretni veci. Ne seznam pratelskych rad.\n\n"
                "Bud vlidny, ale nelzi mu. Cely report do 450 slov."
              )

          kvalita = ""
          if GKEY:
              for model in ("gemini-flash-latest", "gemini-3.6-flash", "gemini-2.5-flash", "gemini-3.5-flash"):
                  try:
                      st, g = post(
                        "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent" % model,
                        {"systemInstruction": {"parts": [{"text": ZADANI}]},
                         "contents": [{"role": "user", "parts": [{"text":
                            "Obdobi: %s az %s. Pocet hovoru: %d. Namluvenych minut: %.1f. "
                            "Slov anglicky: %d, prumer %d na hovor. Predchozi obdobi: %d hovoru, "
                            "%d slov, prumer %d.\n\nROZBORY JEDNOTLIVYCH HOVORU:\n\n%s" % (
                              hranice.strftime("%d.%m."), now.strftime("%d.%m.%Y"),
                              A["n"], A["min"], A["slov"], A["prum"],
                              B["n"], B["slov"], B["prum"], material)}]}],
                         "generationConfig": {"temperature": 0.4, "maxOutputTokens": 2200}},
                        {"x-goog-api-key": GKEY, "Content-Type": "application/json"})
                      c = (g.get("candidates") or [{}])[0]
                      kvalita = "".join(p.get("text", "") for p in (c.get("content", {}).get("parts") or []))
                      if kvalita.strip():
                          print("Report napsan modelem", model, flush=True); break
                  except urllib.error.HTTPError as e:
                      print("model %s nefunguje (%d)" % (model, e.code), flush=True)
                  except Exception as e:
                      print("model %s selhal: %s" % (model, e), flush=True)

          if not kvalita.strip():
              kvalita = "_Slovni cast se nepodarilo vytvorit - zkontroluj secret `GEMINI_API_KEY`._"

          # ---------- 5. poslat ----------
          nadpis = "Report za %s — %s" % (nazev_obd, now.strftime("%d.%m.%Y"))
          telo = (
            "## Čísla\n\n%s\n"
            "Nejdelší hovor: **%d slov** (%s, %s).\n\n---\n\n%s\n\n---\n\n"
            "<sub>Sestaveno z %d rozborů. Období %s – %s.</sub>"
          ) % (cisla, nejdelsi["slov"], nejdelsi["kdy"].strftime("%d.%m."), nejdelsi["tema"],
               kvalita, A["n"], hranice.strftime("%d.%m."), now.strftime("%d.%m.%Y"))

          owner = GHREPO.split("/")[0]
          st, _ = post("https://api.github.com/repos/%s/issues" % GHREPO,
              {"title": nadpis, "body": telo, "labels": ["report"], "assignees": [owner]},
              {"Authorization": "Bearer " + GHTOK, "Accept": "application/vnd.github+json",
               "Content-Type": "application/json", "User-Agent": "kalifornan"})
          print("Report poslan, status", st, flush=True)
          PYEOF
