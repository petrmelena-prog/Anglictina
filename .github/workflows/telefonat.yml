name: Anglicky telefonat

# Pondeli, streda, patek. Cron je v UTC; skript si sam spocita prazsky cas
# a zavola v nahodnou minutu mezi 18:00 a 20:50 - at uz je leto nebo zima.
# Po hovoru pocka, vytahne prepis, necha ho rozebrat a zalozi Issue -> prijde mail.
on:
  schedule:
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  zavolej:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Zavolat, pockat na prepis a poslat rozbor
        env:
          XI_API_KEY:     ${{ secrets.XI_API_KEY }}
          AGENT_ID:       ${{ secrets.AGENT_ID }}
          PHONE_ID:       ${{ secrets.PHONE_ID }}
          TO_NUMBER:      ${{ secrets.TO_NUMBER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:        ${{ github.repository }}
          EVENT:          ${{ github.event_name }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, json, time, random, datetime, zoneinfo
          import urllib.request, urllib.error

          TOPICS = [
              "what he did last weekend",
              "the last time he travelled abroad and what went wrong",
              "how he got into his line of work",
              "his morning routine and whether he's a morning person",
              "a building or place he thinks is beautiful, and why",
              "what he'd do with a free Saturday and no obligations",
              "the weather this week and how it compares to normal",
              "a meal he can cook, step by step",
              "the car he drives and what he'd buy next",
              "a problem on a construction site and how it got solved",
              "his kids or family and what they're up to",
              "a film or series he watched recently",
              "how his town has changed in twenty years",
              "explaining what his company actually does to someone who knows nothing",
              "a deadline he nearly missed",
              "sports — playing or watching",
              "the best holiday he ever had",
              "something he's fixed with his own hands",
              "a client who was difficult, and how he handled it",
              "what he eats for lunch on a normal workday",
              "a piece of technology he refuses to use",
              "how he'd describe Czech food to an American",
              "choosing between two suppliers for a job",
              "something he's learning or would like to learn",
              "the difference between working for someone and running your own thing",
              "a place in the world he's never been but wants to see",
              "what he was like at eighteen",
              "explaining a technical drawing over the phone",
              "his experience with builders and tradesmen",
              "how he relaxes after a hard week",
              "a decision he'd make differently now",
              "prices — what's got expensive lately",
              "a mistake on a project and who paid for it",
              "music he grew up with",
              "what surprises foreigners about the Czech Republic",
              "how he'd spend a million crowns on his house",
              "negotiating a price he thought was too low",
              "a neighbour story",
              "whether he'd ever move abroad for work",
              "something he's proud of finishing",
              "how heating and insulation work in his own house",
              "the last thing that made him laugh",
              "planning a trip he hasn't taken yet",
              "explaining a building permit process to someone abroad",
              "a habit he'd like to break",
              "coffee, beer, or something else — and why",
              "what makes a good colleague",
              "a storm, flood or accident he remembers",
              "how he'd describe his own personality",
              "software he uses every day and what annoys him about it",
              "a childhood summer",
              "giving directions to his office over the phone",
              "what he'd change about his job",
              "an animal or pet story",
              "the first thing he'd show a visitor in his region",
              "a book, podcast or video that changed how he thinks",
              "how long things really take versus how long people think",
              "something he collects, or used to",
              "a moment he was really nervous",
              "what he'd tell someone starting out in his field",
          ]

          KEY    = os.environ["XI_API_KEY"]
          AGENT  = os.environ["AGENT_ID"]
          PHONE  = os.environ["PHONE_ID"]
          TO     = os.environ["TO_NUMBER"]
          GKEY   = os.environ.get("GEMINI_API_KEY", "")
          GHTOK  = os.environ.get("GH_TOKEN", "")
          GHREPO = os.environ.get("GH_REPO", "")
          MANUAL = os.environ.get("EVENT") == "workflow_dispatch"

          PRAHA = zoneinfo.ZoneInfo("Europe/Prague")

          def post(url, body, headers, timeout=60):
              req = urllib.request.Request(url, data=json.dumps(body).encode("utf-8"),
                                           method="POST", headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, json.loads(r.read().decode("utf-8", "replace"))

          def get(url, headers, timeout=60):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          # ---------- 1. pockat na nahodny cas ----------
          now = datetime.datetime.now(PRAHA)
          print("Prazsky cas ted:", now.strftime("%Y-%m-%d %H:%M"), flush=True)
          if MANUAL:
              print("Rucni spusteni - volam hned.", flush=True)
          else:
              start = now.replace(hour=18, minute=0, second=0, microsecond=0)
              end   = now.replace(hour=20, minute=50, second=0, microsecond=0)
              span  = max(int((end - start).total_seconds() // 60), 0)
              cil   = start + datetime.timedelta(minutes=random.randint(0, span))
              cekat = (cil - now).total_seconds()
              if cekat > 0:
                  print("Zavolam v %s - cekam %d minut." % (cil.strftime("%H:%M"), cekat // 60), flush=True)
                  time.sleep(cekat)
              else:
                  print("Okno uz zacalo - volam hned.", flush=True)

          # ---------- 2. zavolat ----------
          tema = random.choice(TOPICS)
          print("Tema hovoru:", tema, flush=True)
          try:
              st, od = post("https://api.elevenlabs.io/v1/convai/twilio/outbound-call",
                  {"agent_id": AGENT, "agent_phone_number_id": PHONE, "to_number": TO,
                   "conversation_initiation_client_data": {"dynamic_variables": {"topic": tema}}},
                  {"xi-api-key": KEY, "Content-Type": "application/json"})
          except urllib.error.HTTPError as e:
              print("CHYBA pri volani", e.code, e.read().decode("utf-8", "replace")[:800], file=sys.stderr, flush=True)
              print("Nejcastejsi priciny: v Twiliu neni povolena Ceska republika "
                    "(Voice / Settings / Geographic Permissions), vycerpany kredit u Twilia, "
                    "nebo zneplatneny API klic.", file=sys.stderr, flush=True)
              sys.exit(1)

          conv = od.get("conversation_id", "")
          print("OK", st, "conversation_id:", conv, flush=True)
          kdy = datetime.datetime.now(PRAHA)

          with open("historie.md", "a", encoding="utf-8") as f:
              f.write("- %s - %s\n" % (kdy.strftime("%d.%m.%Y %H:%M"), tema))

          if not conv:
              print("Bez conversation_id - rozbor preskocen.", flush=True); sys.exit(0)

          # ---------- 3. pockat na prepis ----------
          print("Cekam 8 minut, nez hovor skonci a prepis se zpracuje.", flush=True)
          time.sleep(8 * 60)

          prepis, meta = None, {}
          for pokus in range(12):
              try:
                  d = get("https://api.elevenlabs.io/v1/convai/conversations/" + conv,
                          {"xi-api-key": KEY})
              except urllib.error.HTTPError as e:
                  print("Prepis zatim nejde (%d), zkusim znovu." % e.code, flush=True)
                  time.sleep(45); continue
              stav = d.get("status", "")
              prepis = d.get("transcript") or []
              meta = d.get("metadata") or {}
              print("pokus %d: status=%s, replik=%d" % (pokus + 1, stav, len(prepis)), flush=True)
              if stav != "processing" and prepis:
                  break
              time.sleep(45)

          moje = [t for t in (prepis or []) if t.get("role") == "user" and (t.get("message") or "").strip()]
          if len(moje) < 2:
              print("Hovor nebyl zvednut nebo byl prilis kratky - rozbor nema z ceho vzniknout.", flush=True)
              sys.exit(0)

          radky = []
          for t in prepis:
              kdo = "PETR" if t.get("role") == "user" else "MIKE"
              zprava = (t.get("message") or "").strip()
              if zprava:
                  radky.append("%s: %s" % (kdo, zprava))
          text = "\n".join(radky)
          delka = meta.get("call_duration_secs") or 0
          slov = sum(len((t.get("message") or "").split()) for t in moje)
          print("Prepis mam: %d replik, Petr rekl %d slov, hovor %d s." % (len(prepis), slov, delka), flush=True)

          # ---------- 4. rozbor ----------
          ZADANI = (
            "Jsi zkuseny a vlidny ucitel anglictiny. Petr je Cech, ctyricatnik, vede malou projekcni "
            "kancelar. Jeho MLUVENA anglictina je na urovni A1-A2. Skoro nikdy nemluvil anglicky nahlas "
            "na ciziho cloveka a strasne se za to stydel. Prave dotelefonoval s americkym konverzacnim "
            "partnerem (Mike z Kalifornie). Jeho rec prosla rozpoznavanim hlasu, takze IGNORUJ preslechnuta "
            "slova, chybejici interpunkci a preklepy - hodnot jen skutecny jazyk.\n\n"
            "Napis mu rozbor V CESTINE. Presne tuhle strukturu, nic navic, zadny uvod:\n\n"
            "## Rozumel by ti cizinec?\n"
            "Dve az tri vety, na rovinu. Zvlast rekni, jestli by ho American pochopil bez namahy, "
            "a ZVLAST jestli to byla spravna anglictina. To nejsou tytez veci a Petr to vi.\n\n"
            "## Co ti slo\n"
            "Dva az ctyri body, konkretne - cituj, co skutecne rekl. Zadne obecne chvaleni.\n\n"
            "## Na tomhle zapracuj\n"
            "Nejvys pet bodu, nejdulezitejsi prvni. Format kazdeho bodu:\n"
            "- \u274c co rekl \u2192 \u2705 jak spravne\n"
            "  a pod tim jedna vysvetlujici veta v cestine bez gramatickeho zargonu.\n\n"
            "## Kolik jsi toho namluvil\n"
            "Jedna dve vety: drzel se kratkych bezpecnych odpovedi, nebo se rozmluvil? Rozmluvit se "
            "je jeho hlavni cil, tak to oceň, kdyz se to stalo.\n\n"
            "## Fraze do karticek\n"
            "Ctyri az osm frazi z TOHOTO hovoru, ktere nevedel nebo zkomolil. Vypis je jako blok kodu "
            "(tri zpetne apostrofy), jeden radek na frazi, presne v tomhle formatu:\n"
            '["konverzace","cesky","english","ipa bez lomitek","English example sentence.","Cesky priklad."]\n\n'
            "## Co priste\n"
            "Jedna dve vety, konkretne.\n\n"
            "Bud vlidny, ale nelzi mu. Musi chtit zvednout telefon i pristi pondeli."
          )

          rozbor = ""
          if GKEY:
              for model in ("gemini-flash-latest", "gemini-3.6-flash", "gemini-2.5-flash", "gemini-3.5-flash"):
                  try:
                      st2, g = post(
                        "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent" % model,
                        {"systemInstruction": {"parts": [{"text": ZADANI}]},
                         "contents": [{"role": "user", "parts": [{"text":
                             "Tema hovoru bylo: %s\nDelka hovoru: %d sekund. Petr rekl %d slov.\n\n"
                             "Prepis:\n%s" % (tema, delka, slov, text)}]}],
                         "generationConfig": {"temperature": 0.4, "maxOutputTokens": 2600}},
                        {"x-goog-api-key": GKEY, "Content-Type": "application/json"})
                      c = (g.get("candidates") or [{}])[0]
                      rozbor = "".join(p.get("text", "") for p in (c.get("content", {}).get("parts") or []))
                      if rozbor.strip():
                          print("Rozbor napsan modelem", model, flush=True); break
                  except urllib.error.HTTPError as e:
                      print("model %s nefunguje (%d)" % (model, e.code), flush=True)
                  except Exception as e:
                      print("model %s selhal: %s" % (model, e), flush=True)
          else:
              print("Chybi GEMINI_API_KEY - poslu jen prepis.", flush=True)

          if not rozbor.strip():
              rozbor = ("_Rozbor se nepodarilo vytvorit._ Zkontroluj secret `GEMINI_API_KEY`. "
                        "Prepis hovoru najdes nize.")

          # ---------- 5. Issue -> prijde mail ----------
          nadpis = "Rozbor hovoru - %s - %s" % (kdy.strftime("%d.%m. %H:%M"), tema[:60])
          telo = ("**Tema:** %s  \n**Delka:** %d s  \n**Rekl jsi %d slov anglicky.**\n\n---\n\n%s"
                  "\n\n---\n\n<details><summary>Cely prepis hovoru</summary>\n\n```\n%s\n```\n\n</details>\n\n"
                  "<sub>conversation_id: %s</sub>") % (tema, delka, slov, rozbor, text, conv)

          if GHTOK and GHREPO:
              try:
                  st3, _ = post("https://api.github.com/repos/%s/issues" % GHREPO,
                      {"title": nadpis, "body": telo, "labels": ["rozbor"]},
                      {"Authorization": "Bearer " + GHTOK, "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json", "User-Agent": "kalifornan"})
                  print("Issue zalozeno, status", st3, flush=True)
              except urllib.error.HTTPError as e:
                  print("Issue se nepodarilo zalozit:", e.code, e.read().decode("utf-8","replace")[:400],
                        file=sys.stderr, flush=True)
          PYEOF

      - name: Zapsat historii hovoru
        if: always()
        run: |
          git config user.name  "Kalifornan"
          git config user.email "actions@github.com"
          touch historie.md
          git add historie.md
          git diff --staged --quiet || git commit -m "Telefonat"
          git push || true
